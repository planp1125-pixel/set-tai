name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  TZ: Asia/Kolkata   # tests were authored/verified in IST (time-of-day behaviours)

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SETTAI_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/settai.keystore"
          echo "SETTAI_KEYSTORE_PATH=$RUNNER_TEMP/settai.keystore" >> "$GITHUB_ENV"
      - name: Unit tests
        timeout-minutes: 28
        run: |
          cat > "$RUNNER_TEMP/ci.init.gradle.kts" <<'GR'
          allprojects {
              tasks.withType<Test>().configureEach {
                  systemProperty("java.awt.headless", "true")
                  maxHeapSize = "3g"
                  testLogging { events("started", "passed", "skipped", "failed"); exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL }
              }
          }
          GR
          ./gradlew --init-script "$RUNNER_TEMP/ci.init.gradle.kts" :app:testFullDebugUnitTest --stacktrace
      - name: Build release APKs + Play bundle
        env:
          SETTAI_KEYSTORE_PASSWORD: ${{ secrets.SETTAI_KEYSTORE_PASSWORD }}
          SETTAI_KEY_ALIAS: ${{ secrets.SETTAI_KEY_ALIAS }}
          SETTAI_KEY_PASSWORD: ${{ secrets.SETTAI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFullRelease :app:assemblePlayRelease :app:bundlePlayRelease --stacktrace
      - name: Collect APKs + AAB
        run: |
          set -e
          mkdir -p out
          cp "$(find app/build/outputs/apk/full/release -name '*.apk' | head -1)" out/set-tai-full-release.apk
          cp "$(find app/build/outputs/apk/play/release -name '*.apk' | head -1)" out/set-tai-play-release.apk
          cp "$(find app/build/outputs/bundle/playRelease -name '*.aab' | head -1)" out/set-tai-play-release.aab
          ls -l out
          for f in out/*; do echo "== $f"; keytool -printcert -jarfile "$f" | grep -E 'Owner|SHA256' || true; done
      - uses: actions/upload-artifact@v7
        with:
          name: set-tai-android
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build .deb and .tar.gz
        run: JDK="$JAVA_HOME" OUT="$PWD/dist" bash desktop/packaging/build-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: settai-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  # Windows package is cross-built on Linux (the project's proven script): mingw launcher + jlink'd
  # Windows runtime + NSIS installer, producing a setup .exe and a portable zip.
  desktop-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw, NSIS, Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 nsis python3-pil
      - name: Download matching Linux + Windows Temurin 21
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/jdk/lin" "$RUNNER_TEMP/jdk/win"
          REL=$(curl -fsSL "https://api.adoptium.net/v3/assets/latest/21/hotspot?os=linux&architecture=x64&image_type=jdk&vendor=eclipse" | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['release_name'])")
          echo "Temurin $REL"
          curl -fsSL -o lin.tgz "https://api.adoptium.net/v3/binary/version/$REL/linux/x64/jdk/hotspot/normal/eclipse"
          curl -fsSL -o win.zip "https://api.adoptium.net/v3/binary/version/$REL/windows/x64/jdk/hotspot/normal/eclipse"
          tar -xzf lin.tgz -C "$RUNNER_TEMP/jdk/lin"
          unzip -q win.zip -d "$RUNNER_TEMP/jdk/win"
          echo "JDK=$(ls -d $RUNNER_TEMP/jdk/lin/*)" >> "$GITHUB_ENV"
          echo "WINJDK=$(ls -d $RUNNER_TEMP/jdk/win/*)" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(ls -d $RUNNER_TEMP/jdk/lin/*)" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Windows installer + portable zip
        run: OUT="$PWD/dist" bash desktop/packaging/build-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: settai-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
