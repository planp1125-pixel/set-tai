name: Validate and release v10.38.11 UI test
# Validate the fixed Touch and Motion roaming scope and five-tab navigation.
on:
  push:
    branches:
      - codex/settai-v10.38.2-compose-redesign
    paths:
      - '.github/workflows/validate-v10.38.2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:compileFullDebugKotlin :app:testFullDebugUnitTest --stacktrace

      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SETTAI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing release signing keystore"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/settai.keystore"
          echo "SETTAI_KEYSTORE_PATH=$RUNNER_TEMP/settai.keystore" >> "$GITHUB_ENV"
      - name: Build signed full release APK
        env:
          SETTAI_KEYSTORE_PASSWORD: ${{ secrets.SETTAI_KEYSTORE_PASSWORD }}
          SETTAI_KEY_ALIAS: ${{ secrets.SETTAI_KEY_ALIAS }}
          SETTAI_KEY_PASSWORD: ${{ secrets.SETTAI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFullRelease --stacktrace
      - name: Publish v10.38.11 APK to GitHub Releases without Actions artifacts
        env:
          GH_TOKEN: ${{ secrets.SETTAI_RELEASE_TOKEN || github.token }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then echo "Missing GitHub release token"; exit 1; fi
          gh api repos/"$GITHUB_REPOSITORY" --jq '.permissions' || true
          APK=$(find app/build/outputs/apk/full/release -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/Set-Tai-v10.38.11-ui-test.apk
          if gh release view "ui-v10.38.11-test" >/dev/null 2>&1; then
            gh release upload "ui-v10.38.11-test" out/Set-Tai-v10.38.11-ui-test.apk --clobber
          else
            gh release create "ui-v10.38.11-test" out/Set-Tai-v10.38.11-ui-test.apk --prerelease --title "Set-Tai v10.38.11 UI test" --notes "Compose redesign test APK; main branch unchanged. Install to evaluate the Home, Characters, Create, Explore and Settings redesign." --target "$GITHUB_SHA"
          fi
