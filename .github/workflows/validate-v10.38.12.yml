name: Validate and release v10.38.12 UI test
# Phase 2 (Compose Studio controls) from Codex's local checkpoint. main is unchanged.
on:
  push:
    branches:
      - codex/settai-v10.38.12-phase2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:compileFullDebugKotlin :app:testFullDebugUnitTest --stacktrace
      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SETTAI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing release signing keystore"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/settai.keystore"
          echo "SETTAI_KEYSTORE_PATH=$RUNNER_TEMP/settai.keystore" >> "$GITHUB_ENV"
      - name: Build signed full release APK
        env:
          SETTAI_KEYSTORE_PASSWORD: ${{ secrets.SETTAI_KEYSTORE_PASSWORD }}
          SETTAI_KEY_ALIAS: ${{ secrets.SETTAI_KEY_ALIAS }}
          SETTAI_KEY_PASSWORD: ${{ secrets.SETTAI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFullRelease --stacktrace
      - name: Publish v10.38.12 test APK (prerelease)
        env:
          GH_TOKEN: ${{ secrets.SETTAI_RELEASE_TOKEN || github.token }}
        run: |
          set -e
          APK=$(find app/build/outputs/apk/full/release -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/Set-Tai-v10.38.12-ui-test.apk
          TAG="ui-v10.38.12-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/Set-Tai-v10.38.12-ui-test.apk --prerelease --title "Set-Tai v10.38.12 UI test (run ${GITHUB_RUN_NUMBER})" --notes "Phase 2 Compose Studio controls (Codex checkpoint). main unchanged." --target "$GITHUB_SHA"
