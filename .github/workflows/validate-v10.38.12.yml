name: Validate and release v10.38.12 UI test
# Phase 2 (Compose Studio controls) from Codex's local checkpoint. main is unchanged.
on:
  push:
    branches:
      - codex/settai-v10.38.12-phase2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:compileFullDebugKotlin :app:testFullDebugUnitTest --stacktrace
      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.SETTAI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing release signing keystore"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/settai.keystore"
          echo "SETTAI_KEYSTORE_PATH=$RUNNER_TEMP/settai.keystore" >> "$GITHUB_ENV"
      - name: Build signed full release APK
        env:
          SETTAI_KEYSTORE_PASSWORD: ${{ secrets.SETTAI_KEYSTORE_PASSWORD }}
          SETTAI_KEY_ALIAS: ${{ secrets.SETTAI_KEY_ALIAS }}
          SETTAI_KEY_PASSWORD: ${{ secrets.SETTAI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFullRelease --stacktrace
      - name: Name the test APK
        id: apk
        run: |
          VN=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p out
          cp "$(find app/build/outputs/apk/full/release -name '*.apk' | head -1)" "out/Set-Tai-v${VN}-ui-test.apk"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
      - name: Publish test APK (prerelease)
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ui-v${{ steps.apk.outputs.vn }}-test-${{ github.run_number }}
          name: Set-Tai v${{ steps.apk.outputs.vn }} UI test (run ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Material 3 UI test build. main is unchanged.
          files: out/Set-Tai-v${{ steps.apk.outputs.vn }}-ui-test.apk
